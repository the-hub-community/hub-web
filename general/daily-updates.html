---
layout: default
title: Daily Updates
---



<section class="news-widget" id="dailyNewsWidget">
  <header class="news-widget__header">
    <div class="news-widget__header-copy">
      <p class="news-widget__eyebrow"><i class="fa-solid fa-sparkles" aria-hidden="true"></i> The Hub briefing</p>
      <h1>Daily Pulse</h1>
      <p class="news-widget__subtitle">Headlines that matter to you. Choose a country, explore a topic, or search a story.</p>
    </div>
    <span class="news-widget__edition"><i class="fa-regular fa-newspaper" aria-hidden="true"></i> Your daily read</span>
  </header>

  <div class="news-filter-bar" role="search" aria-label="Filter news stories">
    <div class="news-filter-row news-filter-row--country">
      <label class="news-filter-label" for="newsCountrySelect"><i class="fa-solid fa-globe" aria-hidden="true"></i> Edition</label>
      <select class="news-country-select" id="newsCountrySelect" aria-label="Select country">
        <option value="us">United States</option>
        <option value="in">India</option>
        <option value="ca" selected>Canada</option>
        <option value="gb">United Kingdom</option>
        <option value="au">Australia</option>
        <option value="fr">France</option>
      </select>
    </div>

    <div class="news-filter-row news-filter-row--search">
      <label class="news-filter-label" for="newsSearchInput"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Search stories</label>
      <div class="news-search-wrap">
        <div class="news-search-field">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input
            id="newsSearchInput"
            class="news-search-input"
            type="search"
            placeholder="Try AI, housing, transit..."
            aria-label="Search keyword"
          >
        </div>
        <button id="newsSearchBtn" class="news-search-btn" type="button">Search</button>
        <button id="newsClearBtn" class="news-clear-btn" type="button">Reset filters</button>
      </div>
    </div>

    <div class="news-filter-row news-filter-row--topics">
      <span class="news-filter-label"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> Explore topics</span>
      <div class="news-topic-pills" id="newsTopicPills" role="group" aria-label="Select topic">
        <button class="news-topic-pill active" data-topic="" type="button" aria-pressed="true">All</button>
        <button class="news-topic-pill" data-topic="technology" type="button" aria-pressed="false">Technology</button>
        <button class="news-topic-pill" data-topic="business" type="button" aria-pressed="false">Business</button>
        <button class="news-topic-pill" data-topic="health" type="button" aria-pressed="false">Health</button>
        <button class="news-topic-pill" data-topic="science" type="button" aria-pressed="false">Science</button>
        <button class="news-topic-pill" data-topic="sports" type="button" aria-pressed="false">Sports</button>
      </div>
    </div>

  </div>

  <div class="news-results-heading">
    <h2>Top stories</h2>
    <div class="news-status-bar" id="newsStatusBar" role="status" aria-live="polite"></div>
  </div>

  <div class="news-grid" id="newsGrid" aria-live="polite" aria-busy="false"></div>

  <div class="news-footer">
    <button class="news-load-more" id="newsLoadMore" type="button" hidden>Load more</button>
  </div>
</section>

<script src="{{ site.baseurl }}/assets/js/pages/news.js"></script>
