---
layout: default
title: Submission Received
robots: noindex, nofollow
sitemap: false
---

{% include pages/success-content.html %}

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const submissionId = (params.get("submission_id") || "").trim();
    const submissionType = params.get("type") || "community";
    const subtitles = {
      listing: "Your marketplace listing is queued for review.",
      broadcast: "Your broadcast is published and will appear after the site deploy completes.",
      notification: "Your notice is queued for review.",
      community: "Your community post is queued for review.",
      update: "Your community update is queued for review.",
    };
    const subtitle = document.getElementById("success-subtitle");
    if (subtitle) {
      subtitle.textContent =
        subtitles[submissionType] || "Your contribution is queued for review.";
    }
    if (submissionType === "broadcast") {
      const description = document.getElementById("success-description");
      if (description) {
        description.textContent =
          "Broadcasts publish directly when submitted. The app updates after the site deploy completes.";
      }
      const nextSteps = document.querySelectorAll(".ed-error__list-items li");
      const broadcastSteps = [
        "Your broadcast was committed to the live content branch",
        "The site is building the updated app",
        "Your broadcast will appear when deployment finishes",
        "Track status with your submission reference",
      ];
      broadcastSteps.forEach((step, index) => {
        if (nextSteps[index]) nextSteps[index].textContent = step;
      });
    }
    
    if (submissionId) {
      const panel = document.getElementById("success-submission-id-panel");
      const valueEl = document.getElementById("success-submission-id-value");
      const copyBtn = document.getElementById("success-copy-id-btn");
      const statusLink = document.getElementById("success-track-status-link");
      const livePageLink = document.getElementById("success-live-page-link");
      const historyNote = document.createElement("p");
      historyNote.className = "submission-id-note";

      if (panel && valueEl) {
        valueEl.textContent = submissionId;
        panel.hidden = false;
        panel.appendChild(historyNote);
      }
      if (statusLink) {
        statusLink.href =
          window.ResiHubApi?.buildStatusPageUrl(submissionId) ||
          `/status.html?submission_id=${encodeURIComponent(submissionId)}`;
        statusLink.hidden = false;
      }

      const showLivePage = (rawUrl) => {
        if (!livePageLink) return false;
        try {
          const pageUrl = new URL(rawUrl, window.location.origin);
          if (pageUrl.protocol !== "https:" || pageUrl.hostname !== "hubcollective.ca") {
            return false;
          }
          livePageLink.href = pageUrl.href;
          livePageLink.hidden = false;
          return true;
        } catch (_) {
          return false;
        }
      };

      const checkPublishedPage = async (attempt) => {
        const endpoint = window.ResiHubApi?.ENDPOINTS?.submissionStatus;
        if (!endpoint || attempt > 10 || !livePageLink?.hidden) return;
        try {
          const response = await fetch(
            `${endpoint}?submission_id=${encodeURIComponent(submissionId)}`,
            { cache: "no-store" },
          );
          if (response.ok) {
            const data = await response.json();
            if (data.status === "published" && showLivePage(data.pageUrl)) return;
          }
        } catch (error) {
          console.warn("Could not check publication status.", error);
        }
        window.setTimeout(() => checkPublishedPage(attempt + 1), 15000);
      };
      checkPublishedPage(1);

      try {
        if (!window.ResiHubSubmissionHistory) {
          throw new Error("Submission history is unavailable.");
        }
        window.ResiHubSubmissionHistory.save({
          id: submissionId,
          type: params.get("type") || "submission",
        });
        historyNote.textContent =
          submissionType === "listing"
            ? "Saved in My Submissions on this device. Your private management code is there too."
            : "Saved in My Submissions on this device.";
      } catch (error) {
        historyNote.textContent =
          "Could not save on this device. Copy this reference before leaving.";
        historyNote.setAttribute("role", "alert");
      }

      if (copyBtn) {
        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(submissionId);
            copyBtn.textContent = "Copied!";
            setTimeout(() => { copyBtn.textContent = "Copy"; }, 2000);
          } catch (error) {
            copyBtn.textContent = "Select number to copy";
          }
        });
      }
    }
  });
</script>
