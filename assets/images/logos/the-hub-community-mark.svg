<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <linearGradient id="hubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB" />
            <stop offset="100%" stop-color="#06B6D4" />
        </linearGradient>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-opacity="0.18" />
        </filter>
    </defs>

    <g transform="translate(12, 12)">
        <!-- Triangle outline -->
        <path d="M 38 30 L 64 72 L 12 72 Z"
            fill="none"
            stroke="url(#hubGradient)"
            stroke-width="4.5"
            stroke-linejoin="round"
            opacity="0.35" />

        <!-- Inner dashed links -->
        <path d="M 38 30 L 38 52 L 64 72 M 38 52 L 12 72"
            fill="none"
            stroke="url(#hubGradient)"
            stroke-width="2.5"
            stroke-dasharray="2 2.5"
            opacity="0.55" />

        <!-- Central hub -->
        <circle cx="38" cy="52" r="8" fill="url(#hubGradient)" filter="url(#dropShadow)" />

        <!-- Top node -->
        <circle cx="38" cy="30" r="11" fill="url(#hubGradient)" filter="url(#dropShadow)" />
        <circle cx="38" cy="30" r="4" fill="#FFFFFF" />

        <!-- Bottom-right node -->
        <circle cx="64" cy="72" r="11" fill="url(#hubGradient)" filter="url(#dropShadow)" />
        <circle cx="64" cy="72" r="4" fill="#FFFFFF" />

        <!-- Bottom-left node -->
        <circle cx="12" cy="72" r="11" fill="url(#hubGradient)" filter="url(#dropShadow)" />
        <circle cx="12" cy="72" r="4" fill="#FFFFFF" />
    </g>
</svg>