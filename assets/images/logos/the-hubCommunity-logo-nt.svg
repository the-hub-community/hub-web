<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <!-- Vibrant Blue-to-Cyan Gradient for the Hub Icon -->
        <linearGradient id="hubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB" />
            <stop offset="100%" stop-color="#06B6D4" />
        </linearGradient>

        <!-- Subtle Drop Shadow for depth -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="1" dy="3" stdDeviation="2" flood-opacity="0.15" />
        </filter>
    </defs>

    <!-- ================= LOGO ICON ================= -->
    <g transform="translate(0, 4)">
        <!-- Outer Connecting Network Lines -->
        <path d="M 50 25 L 80 71 L 20 71 Z" fill="none" stroke="url(#hubGradient)" stroke-width="7"
            stroke-linejoin="round" opacity="0.4" />
        <path d="M 50 25 L 50 51 L 80 71 M 50 51 L 20 71" fill="none" stroke="url(#hubGradient)"
            stroke-width="4" stroke-dasharray="2 2" opacity="0.6" />

        <!-- Central Hub Circle -->
        <circle cx="50" cy="51" r="11" fill="url(#hubGradient)" filter="url(#dropShadow)" />

        <!-- Outer Node 1 (Top) -->
        <circle cx="50" cy="25" r="14" fill="url(#hubGradient)" filter="url(#dropShadow)" />
        <circle cx="50" cy="25" r="5.5" fill="#FFFFFF" />

        <!-- Outer Node 2 (Bottom Right) -->
        <circle cx="80" cy="71" r="14" fill="url(#hubGradient)" filter="url(#dropShadow)" />
        <circle cx="80" cy="71" r="5.5" fill="#FFFFFF" />

        <!-- Outer Node 3 (Bottom Left) -->
        <circle cx="20" cy="71" r="14" fill="url(#hubGradient)" filter="url(#dropShadow)" />
        <circle cx="20" cy="71" r="5.5" fill="#FFFFFF" />
    </g>
</svg>