<svg width="920" height="240" viewBox="0 0 920 240" fill="none" xmlns="http://www.w3.org/2000/svg"
    role="img" aria-labelledby="title desc">
    <title id="title">The Hub Collective Horizontal Logo</title>
    <desc id="desc">Modern circular community emblem and wordmark.</desc>
    <defs>
        <linearGradient id="hubCore" x1="24" y1="24" x2="216" y2="216"
