            <path d="M72 129L46 144" />
            <path d="M72 87L46 72" />
        </g>

        <circle cx="108" cy="24" r="12" fill="#D1FAE5" />
        <circle cx="181" cy="66" r="12" fill="#CCFBF1" />
        <circle cx="181" cy="150" r="12" fill="#99F6E4" />
        <circle cx="108" cy="192" r="12" fill="#A7F3D0" />
        <circle cx="35" cy="150" r="12" fill="#CCFBF1" />
