<link rel="stylesheet" href="{{ '/assets/css/custom/ai-assistant.css' | relative_url }}">
<script src="{{ '/assets/js/editor/ai-assistant.js' | relative_url }}" defer></script>
<input type="hidden" name="type" id="type" value="update">
<div id="editor-panel" class="editor-drawer">
    <div class="drawer-inner">
        <div class="drawer-header">
            <!-- Mobile Close/Cancel -->
            <button type="button" class="btn-cancel-header" onclick="togglePanel()" aria-label="Cancel editing">
                <span data-i18n="common.cancel">Cancel</span>
            </button>

            <!-- Title -->
            <h2 id="drawerTitle" data-i18n="editor.update_information">Update Information</h2>

            <!-- Desktop: View Switcher & Close -->
            <div class="drawer-header-actions">
                <div class="drawer-view-switcher" role="tablist" aria-label="Editor mode toggle">
                    <button type="button" id="drawer-edit-view-btn" class="drawer-view-btn active" data-view="edit" data-i18n="common.editor">Editor</button>
                    <button type="button" id="drawer-preview-view-btn" class="drawer-view-btn" data-view="preview" data-i18n="common.preview">Preview</button>
                </div>
                <button type="button" onclick="togglePanel()" class="drawer-close" aria-label="Close">&times;</button>
            </div>
        </div>

        <form id="drawer-form">
            <details class="editor-accordion editor-meta-panel" open>
                <summary class="editor-accordion__summary">
                    <span data-i18n="common.page_details">Page Details</span>
                </summary>
                <div class="editor-accordion__content">
                    <div class="field-row">
                        <div class="floating-group">
                            <input type="text" class="floating-input" id="condo" name="condo" placeholder=" " required>
                            <label class="floating-label" data-i18n="common.community">Community</label>
                        </div>
                        <div class="floating-group">
                            <input type="text" class="floating-input" id="title" name="title" placeholder=" " required data-char-limit="140">
                            <label class="floating-label" data-i18n="common.page_title">Page Title</label>
                        </div>
                    </div>
                </div>
            </details>

            <div id="drawer-edit-view">
                <div class="editor-container-box">
                    <div id="drawer-sections-container"></div>
                    <div class="form-actions">
                        <button type="button" onclick="addNewSection()" class="btn-add-sec btn-secondary">
                            <span data-i18n="common.add_new_section">+ Add New Section</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="drawer-preview-view" class="drawer-preview-hidden">
                <div class="drawer-preview-canvas">
                    <div id="drawer-live-preview-content" class="lh-content-body"></div>
                </div>
            </div>

            <div class="drawer-footer">
                <button type="button" onclick="togglePanel()" class="btn-cancel" data-i18n="common.cancel">Cancel</button>
                <button type="submit" id="sync-btn" class="btn-sync" data-i18n="common.update">Update</button>
            </div>
            <p id="drawerSubmissionError" class="submission-error-inline" style="display: none;"></p>
        </form>
    </div>
</div>

<template id="drawer-section-template">
    <div class="drawer-section-card content-section">
        <details class="ai-section-inline hidden">
            <summary class="ai-section-inline__summary">
                <span class="ai-section-inline__title">AI Suggestion</span>
                <span class="ai-section-inline__meta">Collapsed</span>
            </summary>
            <div class="suggestions-list ai-section-inline__list"></div>
        </details>

        <div class="section-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="sec-label" data-i18n="common.section">Section</span>
                <div class="section-controls" style="display: flex; gap: 2px;">
                    <button type="button" class="btn-move" data-dir="up" aria-label="Move section up"><i class="fa-solid fa-arrow-up"></i></button>
                    <button type="button" class="btn-move" data-dir="down" aria-label="Move section down"><i class="fa-solid fa-arrow-down"></i></button>
                </div>
            </div>
            <button type="button" class="btn-remove-sec" aria-label="Remove Section">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <div class="rich-toolbar-shell">
            <div class="rich-toolbar" role="toolbar" aria-label="Formatting tools">
                <div class="rich-toolbar__group">
                    <button type="button" data-cmd="bold" title="Bold"><i class="fa-solid fa-bold" aria-hidden="true"></i></button>
                    <button type="button" data-cmd="italic" title="Italic"><i class="fa-solid fa-italic" aria-hidden="true"></i></button>
                    <button type="button" data-cmd="underline" title="Underline"><i class="fa-solid fa-underline" aria-hidden="true"></i></button>
                    <button type="button" data-cmd="insertUnorderedList" title="Bulleted List"><i class="fa-solid fa-list-ul" aria-hidden="true"></i></button>
                </div>
                <div class="v-sep" aria-hidden="true"></div>
                <div class="rich-toolbar__group rich-toolbar__group--history">
                    <button type="button" data-cmd="undo" title="Undo"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
                    <button type="button" data-cmd="redo" title="Redo"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
                </div>
                <div class="rich-toolbar__group" style="margin-left: auto;">
                    <button type="button" class="btn-ai-format" title="Auto-format with AI">
                        <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
                        <span class="rich-toolbar__sr-only">AI Format</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="section-body">
            <div class="section-text">
                <div class="editor-area" contenteditable="true" data-char-limit="8000" data-placeholder="Start writing..."></div>
            </div>

            <div class="section-media">
                <div class="media-actions">
                    <div class="image-picker" data-role="image-picker"></div>
                    
                    <div class="video-input-wrapper">
                        <i class="fa-brands fa-youtube"></i>
                        <input type="text" class="video-input" placeholder="Paste a YouTube URL here (optional)">
                    </div>
                    
                    <select class="modern-input video-align-select" style="margin-top: 8px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-default);">
                      <option value="center">Video: Center</option>
                      <option value="left">Video: Float Left</option>
                      <option value="right">Video: Float Right</option>
                    </select>

                    <div class="floating-group" style="margin-top: 8px;">
                        <label class="floating-label" style="position: static; margin-bottom: 4px; font-size: 0.75rem; font-weight: 700; color: var(--outline); text-transform: uppercase;">Section Alignment</label>
                        <select class="modern-input align-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-default); background: var(--surface-container-lowest);">
                            <option value="center">Center Image (Full width)</option>
                            <option value="left">Float Left</option>
                            <option value="right">Float Right</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<style>
  .btn-ai-format {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 6px; background: color-mix(in srgb, var(--primary) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);
    color: var(--primary); font-weight: 600; font-size: 0.75rem; cursor: pointer;
    margin-left: auto;
  }
  .btn-ai-format:hover { background: color-mix(in srgb, var(--primary) 15%, transparent); }
</style>

<script>
   document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.editor-area').forEach((el) => {
            try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
        });

        document.addEventListener('keydown', function(e) {
            if (!e.target.classList || !e.target.classList.contains('editor-area')) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                setTimeout(() => {
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        if (range.startContainer === e.target || (range.startContainer.nodeType === 3 && range.startContainer.parentNode === e.target)) {
                            document.execCommand('insertHTML', false, '<br>');
                        }
                    }
                }, 0);
            }
        });

    function getDrawerSectionPreview(sec) {
        const editor = sec.querySelector('.editor-area');
        const rawText = editor ? editor.innerHTML : '';
        const cleanedText = typeof normalizeEditorHtml === 'function' ? normalizeEditorHtml(rawText) : rawText;
        const align = sec.querySelector('.align-select')?.value || 'center';
        const videoUrl = sec.querySelector('.video-input')?.value || '';
        const videoAlign = sec.querySelector('.video-align-select')?.value || 'center';

        const fileInput = sec.querySelector('.file-input');
        const existingPath = sec.querySelector('.existing-image-path');
        const imageUrl = fileInput?.files?.[0]
            ? URL.createObjectURL(fileInput.files[0])
            : (existingPath?.value || '');

        let videoHtml = '';
        if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
            const id = videoUrl.split('v=')[1]?.split('&')[0] || videoUrl.split('/').pop();
            if (id) {
                videoHtml = `<div class="lh-align-${videoAlign}"><div class="lh-video-container"><iframe src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe></div></div>`;
            }
        }

        let mediaHtml = '';
        if (imageUrl) {
            mediaHtml = `
                <div class="lh-align-${align}">
                    <figure class="lh-image-container">
                        <img src="${imageUrl}" alt="Preview image" class="lh-fluid-img">
                    </figure>
                </div>`;
        }

        return `
            <div class="lh-section">
                ${videoHtml}
                ${mediaHtml}
                <div class="lh-text">${cleanedText}</div>
                <div class="lh-clear"></div>
            </div>`;
    }

    function generateDrawerPreview() {
        const title = document.getElementById('title')?.value || (typeof window.t === 'function' ? window.t('messages.untitled_page', 'Untitled Page') : 'Untitled Page');
        const condo = document.getElementById('condo')?.value || (typeof window.t === 'function' ? window.t('messages.community', 'Community') : 'Community');
        const previewRoot = document.getElementById('drawer-live-preview-content');

        if (!previewRoot) return;

        let html = `<h1>${title}</h1><p class="preview-subtitle">${condo}</p><hr class="preview-hr">`;
        const sections = document.querySelectorAll('#drawer-sections-container .drawer-section-card');

        sections.forEach((sec) => { html += getDrawerSectionPreview(sec); });
        previewRoot.innerHTML = html;
    }

    function switchDrawerView(view) {
        const isPreview = view === 'preview';
        const editView = document.getElementById('drawer-edit-view');
        const previewView = document.getElementById('drawer-preview-view');
        const editBtn = document.getElementById('drawer-edit-view-btn');
        const previewBtn = document.getElementById('drawer-preview-view-btn');

        if (isPreview) generateDrawerPreview();

        if (editView) editView.classList.toggle('drawer-preview-hidden', isPreview);
        if (previewView) previewView.classList.toggle('drawer-preview-hidden', !isPreview);
        if (editBtn) editBtn.classList.toggle('active', !isPreview);
        if (previewBtn) previewBtn.classList.toggle('active', isPreview);
    }

    function updateDrawerToolbarState(editor) {
        const toolbar = editor?.closest('.drawer-section-card')?.querySelector('.rich-toolbar');
        if (!toolbar) return;
        ['bold', 'italic', 'underline'].forEach((command) => {
            const button = toolbar.querySelector(`button[data-cmd="${command}"]`);
            if (!button) return;
            let isActive = false;
            try { isActive = document.queryCommandState(command); } catch (_) { isActive = false; }
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
    }

    function updateWordCount(editor) {
        if (!editor) return;
        const text = (editor.innerText || '').trim();
        const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
        editor.setAttribute('data-wordcount', text ? `${words} word${words === 1 ? '' : 's'}` : '');
    }

    document.addEventListener('input', (e) => {
        if (e.target.classList?.contains('editor-area')) updateWordCount(e.target);
    });
    document.querySelectorAll('.editor-area').forEach(updateWordCount);

    const sectionContainer = document.getElementById('drawer-sections-container');
    if (sectionContainer) {
        const observer = new MutationObserver(() => {
            document.querySelectorAll('.editor-area').forEach((el) => {
                if (!el.dataset.wcBound) { el.dataset.wcBound = 'true'; updateWordCount(el); }
            });
        });
        observer.observe(sectionContainer, { childList: true, subtree: true });
    }

    const drawerViewButtons = document.querySelectorAll('.drawer-view-btn');
    drawerViewButtons.forEach((btn) => {
        btn.addEventListener('click', () => switchDrawerView(btn.dataset.view));
    });

    const drawerForm = document.getElementById('drawer-form');
    if (drawerForm) {
        const livePreviewRefresh = () => {
            if (document.getElementById('drawer-preview-view-btn')?.classList.contains('active')) generateDrawerPreview();
        };
        drawerForm.addEventListener('input', livePreviewRefresh);
        drawerForm.addEventListener('change', livePreviewRefresh);
    }

    if (typeof window.applyTranslations === 'function') window.applyTranslations(document);

    document.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-cmd]');
        if (!btn) return;
        e.preventDefault();
        document.execCommand(btn.getAttribute('data-cmd'), false, btn.getAttribute('data-value') || null);
        const card = btn.closest('.drawer-section-card');
        const editor = card.querySelector('.editor-area');
        if (editor) { editor.focus(); updateDrawerToolbarState(editor); }
    });

    document.addEventListener('mousedown', (e) => {
        if (e.target.closest('button[data-cmd]')) e.preventDefault();
    });
});
</script>
